    if (v.tipo === 'admin') {
      if (a.dataset.new) { s.form = {}; log(['GET /admin/platos/nuevo  →  plato-form.html']); }
      else if (a.dataset.edit) { const p = db.find(x => x.id === +a.dataset.edit); s.form = { ...p }; log([`GET /admin/platos/${p.id}/editar  →  plato-form.html`, 'Hibernate: select … from plato where id=?']); }
      else if (a.dataset.cancel) { s.form = null; log(['GET /admin/platos  →  admin.html', 'Hibernate: select … from plato order by nombre']); }
      else if (a.dataset.menu) { const mi = views.findIndex(x => x.tipo === 'menu'); if (mi >= 0) { st[mi].plato = null; setTab(mi); } return; }
      render(); return;
    }
    if (a.dataset.f !== undefined) { s.f = a.dataset.f; s.plato = null; }
    else if (a.dataset.plato) s.plato = +a.dataset.plato;
    else if (a.dataset.back) s.plato = null;
    render();
  });
  root.addEventListener('submit', e => {
    e.preventDefault();
    const v = views[cur], s = st[cur]; if (!v.interactivo) return;
    const fm = e.target;
    if (fm.dataset.form) {
      const id = +fm.id.value || null, nombre = fm.nombre.value.trim(), tipo = fm.tipo.value.toLowerCase(), precio = +fm.precio.value;
      if (id) { Object.assign(db.find(x => x.id === id), { nombre, tipo, precio }); log(['POST /admin/platos  (con id ' + id + ')', 'Hibernate: update plato set nombre=?, precio=?, tipo=? where id=?', '302  →  GET /admin/platos']); }
      else { db.push({ id: nextId, nombre, tipo, precio }); log(['POST /admin/platos  (sin id)', 'Hibernate: insert into plato (nombre, precio, tipo) values (?, ?, ?)   → id ' + nextId, '302  →  GET /admin/platos']); nextId++; }
      s.form = null;
    } else if (fm.dataset.del) {
      const id = +fm.dataset.del, i = db.findIndex(x => x.id === id);
      if (i >= 0) db.splice(i, 1);
      log(['POST /admin/platos/' + id + '/eliminar   (en su máquina, el navegador pide confirmación)', 'Hibernate: delete from plato where id=?', '302  →  GET /admin/platos']);
    }
    render();
  });
  el.addEventListener('click', e => { const b = e.target.closest('.btabs button'); if (!b) return; st[+b.dataset.i].plato = null; setTab(+b.dataset.i); });
  render();
}

// ---------- recorrido ----------
function mountSim(el, rec, sid) {
  const ET = rec.etapas, NO = rec.nodos;
  if (!S.sim || typeof S.sim !== 'object') S.sim = {};
  let i = Math.min(S.sim[sid] || 0, ET.length) - 1;
  el.innerHTML = `<div class="sim"><div class="lanes" style="grid-template-columns:repeat(${NO.length}, minmax(0, 1fr))">${NO.map(([l, a, b], k) => `<div class="node" data-k="${k}">${l ? `<span class="letter ${l}">${l}</span> ` : ''}${a}<b>${b}</b></div>`).join('')}</div>
    <div class="stage" aria-live="polite"></div>
    <div class="simnav"><button type="button" class="btn ghost" data-s="-1">Etapa anterior</button><button type="button" class="btn primary" data-s="1">Etapa siguiente</button><span class="pips">${ET.map(() => '<i></i>').join('')}</span></div></div>`;
  function draw() {
    const e = ET[i];
    el.querySelectorAll('.node').forEach(n => n.classList.toggle('on', !!e && e.n.includes(+n.dataset.k)));
    el.querySelectorAll('.pips i').forEach((p, k) => p.classList.toggle('on', k <= i));
    $('.stage', el).innerHTML = e ? `<p><b>Etapa ${i + 1} de ${ET.length}.</b> ${md(e.t)}</p><span class="cargo">Viaja: ${esc(e.c)}</span>` : `<p>Presione <b>Etapa siguiente</b> para empezar el recorrido.</p>`;
    $('[data-s="-1"]', el).disabled = i < 0;
    $('[data-s="1"]', el).disabled = i >= ET.length - 1;
  }
  el.addEventListener('click', ev => { const b = ev.target.closest('[data-s]'); if (!b) return; i = Math.max(-1, Math.min(ET.length - 1, i + +b.dataset.s)); S.sim[sid] = Math.max(S.sim[sid] || 0, i + 1); save(); draw(); });
  draw();
}

// ---------- ruta ----------
const IDS = ['inicio', ...pasos.map(p => p.id), 'cierre'];
const doneCount = () => pasos.filter(p => S.done[p.id]).length;
function unlocked(id) {
  if (id === 'inicio') return true;
  if (id === 'cierre') return pasos.every(p => S.done[p.id]);
  const k = pasos.findIndex(p => p.id === id);
  return k === 0 || !!S.done[pasos[k - 1].id];
}
function frontier() { const p = pasos.find(p => !S.done[p.id]); return p ? p.id : 'cierre'; }
function renderRoute(cur) {
  const items = [['inicio', 'Antes de empezar', '', '·'], ...pasos.map((p, k) => [p.id, p.corto, p.letra, k]), ['cierre', 'Cierre y certificado', '', '★']];
  $('#routeList').innerHTML = items.map(([id, t, l, n]) => {
    const done = S.done[id] || (id === 'inicio' && S.started) || (id === 'cierre' && S.certified);
    return `<li><button type="button" class="ritem${done ? ' done' : ''}" data-go="${id}" ${unlocked(id) ? '' : 'disabled'} ${id === cur ? 'aria-current="page"' : ''}><span class="rnum">${done ? '✓' : n}</span><span class="rtxt">${esc(t)}</span>${l ? `<span class="letter ${l}">${l}</span>` : '<span></span>'}</button></li>`;
  }).join('');
  $('#routeSelect').innerHTML = items.map(([id, t, , n]) => `<option value="${id}" ${id === cur ? 'selected' : ''} ${unlocked(id) ? '' : 'disabled'}>${typeof n === 'number' ? 'Paso ' + n + ' · ' : ''}${esc(t)}${S.done[id] ? ' ✓' : ''}</option>`).join('');
  const d = doneCount();
  $('#meterFill').style.width = (d / pasos.length * 100) + '%';
  $('#meterTxt').textContent = `${d} de ${pasos.length} pasos`;
}

// ---------- vistas ----------
function viewInicio() {
  const I = DATA.inicio, f = frontier();
  const fl = f === 'cierre' ? 'Ir al cierre' : (S.started ? 'Continuar en el paso ' + f.split('-')[1] : 'Empezar el paso 0');
  return `<div class="view">
  <header class="hero"><div class="eyebrow">${esc(I.eyebrow)}</div><h2>${md(I.titulo)}</h2><p>${md(I.texto)}</p></header>
  <div class="analogy"><b>Antes de empezar.</b> ${md(I.previo)}</div>
  <section class="block"><h3>Lo que va a tener funcionando</h3>
    <div class="cards">${I.cards.map(([c, d]) => `<div class="card"><code>${esc(c)}</code><p>${md(d)}</p></div>`).join('')}</div>
    <div id="heroBrowser"></div><p class="bnote">${md(I.previewNota)}</p></section>
  <section class="block"><h3>Los archivos de esta ruta</h3>
    <div class="files">${I.archivos.map(([l, fi, d, p]) => `<div class="file">${l ? `<span class="letter ${l}">${l}</span>` : '<span></span>'}<span><code>${fi}</code> <span class="d">${md(d)}</span></span><small>${p}</small></div>`).join('')}</div>
    <p>${md(I.nocambian)}</p>
    <p class="bnote"><span class="letter M">M</span> Modelo · <span class="letter V">V</span> Vista · <span class="letter C">C</span> Controlador</p></section>
  <section class="block"><h3>Cómo funciona esta ruta</h3>
    <div class="cards">
      <div class="card"><b>Un paso a la vez</b><p>Cada paso explica primero el concepto y después le dice qué hacer y dónde.</p></div>
      <div class="card"><b>Código con notas</b><p>Toque una nota y se ilumina la línea que explica. Lo nuevo aparece en verde.</p></div>
      <div class="card"><b>Compruebe y responda</b><p>Para pasar al siguiente paso, marque lo que ya le funciona y responda una pregunta.</p></div>
      <div class="card"><b>¿No funciona?</b><p>Cada paso trae los errores más comunes y cómo resolverlos.</p></div>
    </div>
    <div class="analogy">Escriba el código usted mismo en lugar de copiarlo: así se aprende. Use el botón <b>Copiar</b> solo si se atasca. Su avance se guarda en este navegador.</div></section>
  <section class="block"><h3>¿Quién hace la ruta?</h3>
    <div class="field"><label for="nombre">Su nombre completo (aparecerá en el certificado)</label><input id="nombre" autocomplete="name" value="${esc(S.name)}" placeholder="Ej.: María Fernanda Pérez"></div></section>
  <div class="stepnav"><span class="grow"></span><button type="button" class="btn primary" id="start">${fl}</button></div>
  </div>`;
}
function stepReady(p) { return p.compruebe.every((_, i) => S.checks[p.id] && S.checks[p.id][i]) && S.answers[p.id] === p.pregunta.ok; }
function viewPaso(p, k) {
  const ops = p.pregunta.ops.map((o, i) => { const a = S.answers[p.id]; const cls = a === undefined ? '' : (i === p.pregunta.ok && a === i ? 'right' : (i === a ? 'wrong' : '')); return `<button type="button" data-op="${i}" class="${cls}" ${a === p.pregunta.ok ? 'disabled' : ''}>${md(o)}</button>`; }).join('');
  const a = S.answers[p.id];
  const fb = a === undefined ? '' : (a === p.pregunta.ok ? `<p class="fb ok"><b>¡Correcto!</b> ${md(p.pregunta.exp)}</p>` : `<p class="fb no"><b>Todavía no.</b> Vuelva a leer «Entienda primero» e intente otra vez.</p>`);
  const viewSpec = p.ver ? [p.ver, ...(p.ver.extra || [])] : null;
  return `<div class="view">
  <header><div class="eyebrow">Paso ${k} de ${pasos.length - 1}${p.letra ? ` · <span class="letter ${p.letra}">${p.letra}</span> ${{ M: 'Modelo', V: 'Vista', C: 'Controlador' }[p.letra]}` : ''} · unos ${p.minutos} min</div>
    <h2>${md(p.titulo)}</h2><p class="goal"><b>Qué vamos a hacer:</b> ${md(p.meta)}</p></header>
  <section class="block prose"><h3><span class="tag">1</span> Entienda primero</h3>${p.entienda.map(t => `<p>${md(t)}</p>`).join('')}${p.analogia ? `<div class="analogy"><b>Piénselo así.</b> ${md(p.analogia)}</div>` : ''}</section>
  ${p.recorrido ? `<section class="block"><h3><span class="tag">2</span> Simulador del recorrido</h3><div id="sim"></div></section>` : ''}
  <section class="block"><h3><span class="tag">${p.recorrido ? 3 : 2}</span> Haga esto</h3><ol class="actions">${p.acciones.map(ac => `<li><div class="act"><p>${md(ac.t)}</p>${ac.tabla ? `<div class="tbl"><table><thead><tr>${ac.tabla.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${ac.tabla.rows.map(r => `<tr>${r.map(c => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}${ac.code ? codeBlock(ac.code) : ''}</div></li>`).join('')}</ol></section>
  ${p.seguridad ? `<div class="sec"><b>Seguridad.</b> ${md(p.seguridad)}</div>` : ''}
  ${viewSpec ? `<section class="block"><h3><span class="tag">✓</span> Lo que debe ver</h3><div id="pv"></div>${p.ver.nota ? `<p class="bnote">${md(p.ver.nota)}</p>` : ''}</section>` : ''}
  <section class="block"><h3><span class="tag">✓</span> Compruebe en su máquina</h3><ul class="checks">${p.compruebe.map((c, i) => `<li><label><input type="checkbox" data-ck="${i}" ${S.checks[p.id] && S.checks[p.id][i] ? 'checked' : ''}><span>${md(c)}</span></label></li>`).join('')}</ul></section>
  <section class="block"><h3><span class="tag">?</span> Pregunta del paso</h3><div class="quiz"><p class="q">${md(p.pregunta.q)}</p><div class="ops">${ops}</div><div id="fb">${fb}</div></div></section>
  <section class="block"><h3><span class="tag">!</span> ¿No funciona?</h3>${p.errores.map(e => `<details class="err"><summary>${md(e.s)}</summary><div>${md(e.f)}</div></details>`).join('')}</section>
  <div class="stepnav"><button type="button" class="btn ghost" data-go="${IDS[k]}">Anterior</button><span class="grow"></span><span class="pending" id="pending"></span><button type="button" class="btn primary" id="complete">${S.done[p.id] ? 'Paso completado · Seguir' : 'Completar y seguir'}</button></div>
  </div>`;
}
function updatePending(p) {
  const faltan = p.compruebe.length - p.compruebe.filter((_, i) => S.checks[p.id] && S.checks[p.id][i]).length;
  const q = S.answers[p.id] === p.pregunta.ok;
  const parts = []; if (faltan) parts.push(faltan === 1 ? 'falta 1 verificación' : `faltan ${faltan} verificaciones`); if (!q) parts.push('falta la pregunta');
  $('#pending').textContent = parts.length ? 'Para seguir: ' + parts.join(' y ') + '.' : '';
  $('#complete').disabled = !!parts.length;
}

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(7, '0').slice(-7); }
function viewCierre() {
  const K = DATA.cierre;
  const aciertos = pasos.filter(p => S.first[p.id]).length;
  if (!S.certified) { S.certified = new Date().toISOString().slice(0, 10); save(); }
  const fecha = new Date(S.certified + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
  const name = S.name.trim();
  const cod = K.prefijo + '-' + hash((name || 'anon') + '|' + S.certified + '|' + aciertos + '|' + K.prefijo);
  return `<div class="view">
  <header class="hero"><div class="eyebrow">Cierre</div><h2>${md(K.titulo)}</h2><p>${md(K.texto)}</p></header>
  <section class="block"><div id="pvFinal"></div></section>
  <section class="block"><h3>Guarde su trabajo</h3>${codeBlock({ archivo: 'Terminal', lang: 'sh', modo: 'terminal', code: K.commit, notas: [] })}<p>${md(K.readme)}</p></section>
  <section class="block"><h3>Explore: retos</h3><p class="bnote">Resuelva al menos cuatro. Antes de probar, escriba en su bitácora qué cree que pasará; después, qué pasó y por qué.</p>
    <div class="retos">${retos.map((r, i) => `<div class="reto"><span class="eyebrow">Reto ${i + 1}</span><p>${md(r.q)}</p><button type="button" data-hint="${i}">Ver pista</button><p class="hint" id="hint${i}" hidden>${md(r.p)}</p></div>`).join('')}</div></section>
  <section class="block"><h3>Mini-reto de transferencia</h3><p>${md(K.transfer)}</p>
    <div class="tbl"><table><thead><tr>${K.transferHead.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${transferencia.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="analogy"><b>Regla del cero.</b> ${md(K.reglaCero)}</div></section>
  <section class="block"><h3>Su certificado</h3>
    ${name ? '' : `<div class="field"><label for="nombre2">Escriba su nombre completo para el certificado</label><input id="nombre2" autocomplete="name" placeholder="Ej.: María Fernanda Pérez"></div>`}
    <div class="cert"><span class="eyebrow" style="justify-content:center">SENA · Centro de Comercio y Servicios · ADSO 3230489</span>
      <h3>${esc(K.cert)}</h3><div class="who">${name ? esc(name) : 'Escriba su nombre arriba'}</div>
      <p class="meta">${pasos.length} pasos · ${aciertos} de ${pasos.length} preguntas al primer intento · ${fecha}</p>
      <p class="meta">Código de verificación <span class="code-v">${cod}</span></p></div>
    <p class="bnote">Tome una captura de pantalla del certificado y agréguela a su README.</p></section>
  <section class="block"><h3>Volver a empezar</h3><div class="confirm" id="resetBox"><button type="button" class="btn ghost" id="reset">Borrar mi progreso</button></div></section>
  </div>`;
}

// ---------- navegación ----------
let current = 'inicio';
function go(id, push = true) {
  if (!IDS.includes(id)) id = 'inicio';
  if (!unlocked(id)) id = frontier();
  current = id;
  if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  const app = $('#app');
  const k = pasos.findIndex(p => p.id === id);
  if (id === 'inicio') {
    app.innerHTML = viewInicio();
    mountBrowser($('#heroBrowser'), DATA.inicio.preview);
    $('#nombre').addEventListener('input', e => { S.name = e.target.value; save(); });
    $('#start').addEventListener('click', () => { S.started = S.started || new Date().toISOString(); save(); go(frontier() === 'cierre' ? 'cierre' : frontier()); });
  } else if (id === 'cierre') {
    app.innerHTML = viewCierre();
    mountBrowser($('#pvFinal'), DATA.cierre.preview);
    const n2 = $('#nombre2'); if (n2) n2.addEventListener('change', e => { S.name = e.target.value; save(); go('cierre'); });
    $('#reset').addEventListener('click', () => {
      $('#resetBox').innerHTML = '<span>¿Seguro? Se borran todos los pasos completados.</span><button type="button" class="btn primary" id="resetYes">Sí, borrar</button><button type="button" class="btn ghost" id="resetNo">Cancelar</button>';
      $('#resetYes').onclick = () => { S = { name: S.name, done: {}, checks: {}, answers: {}, first: {}, sim: {}, started: '' }; save(); go('inicio'); };
      $('#resetNo').onclick = () => go('cierre');
    });
  } else {
    const p = pasos[k];
    app.innerHTML = viewPaso(p, k);
    if (p.ver) mountBrowser($('#pv'), [p.ver, ...(p.ver.extra || [])]);
    if (p.recorrido) mountSim($('#sim'), p.recorrido, p.id);
    app.querySelectorAll('[data-ck]').forEach(c => c.addEventListener('change', () => { (S.checks[p.id] = S.checks[p.id] || [])[+c.dataset.ck] = c.checked; save(); updatePending(p); }));
    app.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.op;
      if (S.first[p.id] === undefined) S.first[p.id] = i === p.pregunta.ok;
      S.answers[p.id] = i; save();
      app.querySelectorAll('[data-op]').forEach(x => { const j = +x.dataset.op; x.className = (j === i) ? (i === p.pregunta.ok ? 'right' : 'wrong') : ''; x.disabled = i === p.pregunta.ok; });
      $('#fb').innerHTML = i === p.pregunta.ok ? `<p class="fb ok"><b>¡Correcto!</b> ${md(p.pregunta.exp)}</p>` : `<p class="fb no"><b>Todavía no.</b> Vuelva a leer «Entienda primero» e intente otra vez.</p>`;
      updatePending(p);
    }));
    $('#complete').addEventListener('click', () => { S.done[p.id] = true; save(); go(IDS[k + 2]); });
    updatePending(p);
  }
  renderRoute(id);
  window.scrollTo({ top: 0 });
}

// eventos globales
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && !g.disabled) { go(g.dataset.go); return; }
  const n = e.target.closest('.notes button');
  if (n) {
    const cb = document.getElementById(n.dataset.cb);
    cb.querySelectorAll('.ln.on').forEach(x => x.classList.remove('on'));
    n.closest('.notes').querySelectorAll('button.on').forEach(x => x.classList.remove('on'));
    const ln = cb.querySelector(`.ln[data-l="${n.dataset.l}"]`);
    if (ln) { ln.classList.add('on'); n.classList.add('on'); const pre = cb.querySelector('pre'); const top = ln.offsetTop - pre.clientHeight / 2; pre.scrollTo?.({ top: Math.max(0, top) }); ln.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    return;
  }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const cb = document.getElementById(c.dataset.copy);
    const text = [...cb.querySelectorAll('.ln .tx')].map(x => x.textContent.replace(/^ $/, '')).join('\n');
    const ok = () => { c.textContent = 'Copiado'; setTimeout(() => (c.textContent = 'Copiar'), 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(cb.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Seleccionado: Ctrl + C'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
    return;
  }
  const h = e.target.closest('[data-hint]');
  if (h) { const el = document.getElementById('hint' + h.dataset.hint); el.hidden = !el.hidden; h.textContent = el.hidden ? 'Ver pista' : 'Ocultar pista'; return; }
  const t = e.target.closest('.term');
  const pop = $('#pop');
  if (t) {
    const def = glosario[t.dataset.t] || '';
    pop.innerHTML = `<b>${esc(t.dataset.t)}</b>${esc(def)}`; pop.hidden = false;
    const r = t.getBoundingClientRect();
    const w = Math.min(300, innerWidth - 32);
    pop.style.maxWidth = w + 'px';
    pop.style.left = Math.max(16, Math.min(r.left + scrollX, scrollX + innerWidth - w - 16)) + 'px';
    pop.style.top = (r.bottom + scrollY + 8) + 'px';
    return;
  }
  if (!e.target.closest('#pop')) pop.hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#pop').hidden = true; });
$('#routeSelect').addEventListener('change', e => go(e.target.value));
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) go(id, false); });
go(location.hash.slice(1) || (S.started ? frontier() : 'inicio'), true);
</script>
