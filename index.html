<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cafetería con PostgreSQL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una pizarra de menú arriba, la ruta de pasos a la izquierda como la carta, y un paso a la vez en una columna de lectura */
:root {
  --paper: #f3f5f1;
  --sheet: #ffffff;
  --ink: #1a2520;
  --ink-soft: #56645c;
  --line: #d3dcd3;
  --board: #183630;
  --board-2: #21463e;
  --board-ink: #eef4ef;
  --chalk: #f5d77a;
  --accent: #9b1d3a;
  --accent-soft: #f7e6ea;
  --ok: #2b7d00;
  --ok-bg: #e5f3dc;
  --bad: #b3261e;
  --bad-bg: #fbe6e4;
  --m: #1d5f8a; --m-bg: #e2eef6;
  --v: #9b1d3a; --v-bg: #f7e6ea;
  --c: #9a5a00; --c-bg: #f8eedc;
  --code-bg: #14201c;
  --code-ink: #e3ece6;
  --code-dim: #7f948a;
  --code-new: rgba(120, 210, 90, .16);
  --code-on: rgba(245, 215, 122, .22);
  --focus: #e08a00;
  --display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111816; --sheet: #18211e; --ink: #e5ede8; --ink-soft: #a4b4ab; --line: #2c3a35;
  --board: #0d211d; --board-2: #163028; --board-ink: #e5efe8; --chalk: #f2cf63;
  --accent: #f07b96; --accent-soft: #3a1b24; --ok: #84d65c; --ok-bg: #1a3313; --bad: #ff8f84; --bad-bg: #3c1b18;
  --m: #7fb9e3; --m-bg: #15293a; --v: #f07b96; --v-bg: #3a1b24; --c: #f0b45a; --c-bg: #3a2a12;
  --code-bg: #0b1311; --code-ink: #e3ece6; --code-dim: #75897f; --focus: #f2a33a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111816; --sheet: #18211e; --ink: #e5ede8; --ink-soft: #a4b4ab; --line: #2c3a35;
  --board: #0d211d; --board-2: #163028; --board-ink: #e5efe8; --chalk: #f2cf63;
  --accent: #f07b96; --accent-soft: #3a1b24; --ok: #84d65c; --ok-bg: #1a3313; --bad: #ff8f84; --bad-bg: #3c1b18;
  --m: #7fb9e3; --m-bg: #15293a; --v: #f07b96; --v-bg: #3a1b24; --c: #f0b45a; --c-bg: #3a2a12;
  --code-bg: #0b1311; --code-ink: #e3ece6; --code-dim: #75897f; --focus: #f2a33a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
code, kbd { font-family: var(--mono); font-size: .86em; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; overflow-wrap: anywhere; }
a { color: var(--m); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- pizarra ---------- */
.board { background: var(--board); color: var(--board-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.board-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: .01em; }
.brand h1 span { color: var(--chalk); }
.brand small { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; opacity: .78; }
.meter { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 220px; flex: 0 1 340px; }
.meter-bar { flex: 1; height: 8px; background: var(--board-2); border-radius: 8px; overflow: hidden; }
.meter-bar i { display: block; height: 100%; width: 0; background: var(--chalk); transition: width .4s ease; }
.meter b { font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }

/* ---------- estructura ---------- */
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.route { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
.route h2 { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--body); margin: 0 0 8px 10px; }
.route ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ritem { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left;
  border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.ritem:hover:not(:disabled) { background: var(--sheet); }
.ritem[aria-current="page"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--accent); }
.ritem:disabled { cursor: not-allowed; opacity: .5; }
.rnum { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; border: 1.5px solid var(--line); font-variant-numeric: tabular-nums; }
.ritem.done .rnum { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rtxt { font-size: .92rem; line-height: 1.25; }
.route-mobile { display: none; }

.letter { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px; font-size: .72rem; font-weight: 700; font-family: var(--mono); }
.letter.M { background: var(--m-bg); color: var(--m); }
.letter.V { background: var(--v-bg); color: var(--v); }
.letter.C { background: var(--c-bg); color: var(--c); }

main { min-width: 0; }
.view { max-width: 820px; display: grid; gap: 28px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.view > header h2 { font-size: clamp(1.7rem, 3.2vw, 2.35rem); font-weight: 800; margin-top: 6px; }
.goal { margin-top: 12px; font-size: 1.08rem; }
.goal b { color: var(--accent); }

section.block { display: grid; gap: 12px; }
.view > *, section.block > * { min-width: 0; }
section.block > h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
section.block > h3 .tag { font-family: var(--body); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.prose p { margin: 0 0 10px; max-width: 68ch; }
.analogy { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; max-width: 68ch; }
.analogy b { color: var(--accent); }

ol.actions { list-style: none; counter-reset: a; margin: 0; padding: 0; display: grid; gap: 18px; }
ol.actions > li { counter-increment: a; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
ol.actions > li::before { content: counter(a); width: 30px; height: 30px; border-radius: 50%; background: var(--board); color: var(--board-ink); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.act { min-width: 0; display: grid; gap: 12px; }
.act > p { margin: 3px 0 0; }

/* ---------- tablas ---------- */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- código ---------- */
.code { border-radius: 12px; overflow: hidden; background: var(--code-bg); color: var(--code-ink); }
.code-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: #0000002e; border-bottom: 1px solid #ffffff14; }
.code-head .fname { font-family: var(--mono); font-weight: 600; font-size: .9rem; }
.code-head .fpath { font-family: var(--mono); font-size: .74rem; color: var(--code-dim); overflow-wrap: anywhere; flex-basis: 100%; order: 5; }
.mode { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: #ffffff1a; }
.mode.crear { background: #78d25a33; color: #b9f09d; }
.mode.reemplazar { background: #f5d77a33; color: #f5d77a; }
.copy { margin-left: auto; border: 1px solid #ffffff33; background: transparent; color: var(--code-ink); border-radius: 6px; padding: 3px 10px; font-size: .8rem; cursor: pointer; }
.copy:hover { background: #ffffff14; }
.code pre { margin: 0; padding: 10px 0; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.6; tab-size: 4; }
.ln { display: grid; grid-template-columns: 44px minmax(max-content, 1fr); }
.ln .no { text-align: right; padding-right: 12px; color: var(--code-dim); user-select: none; font-variant-numeric: tabular-nums; position: relative; }
.ln .tx { padding-right: 16px; white-space: pre; }
.ln.new { background: var(--code-new); }
.ln.new .no { color: #9fe07f; }
.ln.on { background: var(--code-on); }
.ln .pin { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; border-radius: 50%; background: var(--chalk); color: #2a2205; font-size: .6rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.code .legend { font-size: .76rem; color: var(--code-dim); padding: 0 12px 10px; display: flex; gap: 14px; flex-wrap: wrap; }
.code .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--code-new); outline: 1px solid #9fe07f66; margin-right: 6px; vertical-align: -1px; }
.t-com { color: #7f948a; font-style: italic; } .t-str { color: #f2c27b; } .t-ann { color: #f5d77a; font-weight: 600; } .t-kw { color: #f08aa5; }
.t-typ { color: #8cc8ef; } .t-num { color: #c3a6ff; } .t-tag { color: #f08aa5; } .t-th { color: #9fe07f; font-weight: 600; } .t-attr { color: #8cc8ef; }
.t-sel { color: #f08aa5; } .t-prop { color: #8cc8ef; } .t-var { color: #9fe07f; } .t-cmd { color: #9fe07f; font-weight: 600; }

.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); padding: 6px; }
.notes > li > button { width: 100%; text-align: left; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; border: 0; background: transparent; padding: 8px; border-radius: 6px; cursor: pointer; font-size: .93rem; }
.notes > li > button:hover, .notes > li > button.on { background: var(--paper); }
.notes .pinx { width: 20px; height: 20px; border-radius: 50%; background: var(--chalk); color: #2a2205; font-size: .7rem; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.notes-title { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 2px 0 -4px; }

/* ---------- navegador simulado ---------- */
.browser { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sheet); box-shadow: 0 8px 24px #0000000f; }
.bbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.url { flex: 1; min-width: 0; font-family: var(--mono); font-size: .8rem; background: var(--sheet); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btabs { display: flex; gap: 6px; flex-wrap: wrap; }
.btabs button { border: 1px solid var(--line); background: var(--sheet); border-radius: 20px; padding: 3px 10px; font-family: var(--mono); font-size: .74rem; cursor: pointer; }
.btabs button[aria-pressed="true"] { background: var(--board); color: var(--board-ink); border-color: var(--board); }
.bview { min-height: 140px; max-height: 460px; overflow: auto; }
.bnote { font-size: .92rem; color: var(--ink-soft); margin: 0; }
.json { margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: .82rem; line-height: 1.55; white-space: pre; overflow-x: auto; color: var(--ink); background: var(--sheet); }
.json .k { color: var(--m); } .json .s { color: var(--accent); } .json .n { color: var(--ok); }

/* ---------- comprobación y pregunta ---------- */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.checks label:has(input:checked) { border-color: var(--ok); background: var(--ok-bg); }
.quiz { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.quiz p.q { margin: 0; font-weight: 700; font-size: 1.05rem; }
.ops { display: grid; gap: 8px; }
.ops button { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.ops button:hover:not(:disabled) { border-color: var(--ink-soft); }
.ops button.right { border-color: var(--ok); background: var(--ok-bg); font-weight: 700; }
.ops button.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ops button:disabled { cursor: default; }
.fb { border-radius: 10px; padding: 10px 14px; margin: 0; }
.fb.ok { background: var(--ok-bg); } .fb.no { background: var(--bad-bg); }
details.err { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
details.err summary { cursor: pointer; padding: 10px 14px; font-weight: 700; }
details.err div { padding: 0 14px 12px 14px; }
details.err + details.err { margin-top: -4px; }

.stepnav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.btn { border: 1.5px solid var(--board); background: transparent; color: var(--ink); border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--board); color: var(--board-ink); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: var(--line); }
.pending { font-size: .9rem; color: var(--ink-soft); }
.stepnav .grow { flex: 1; }

/* ---------- recorrido ---------- */
.sim { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.node { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; font-size: .84rem; transition: transform .25s, border-color .25s, background .25s; min-width: 0; overflow-wrap: anywhere; }
.node b { display: block; font-family: var(--mono); font-size: .78rem; margin-top: 4px; }
.node.on { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.stage { display: grid; gap: 6px; min-height: 92px; }
.stage p { margin: 0; }
.cargo { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: .8rem; background: var(--paper); border: 1px dashed var(--ink-soft); border-radius: 8px; padding: 4px 10px; justify-self: start; }
.simnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pips { display: flex; gap: 5px; margin-left: auto; } .pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .pips i.on { background: var(--accent); }

/* ---------- inicio y cierre ---------- */
.hero { display: grid; gap: 14px; }
.hero h2 { font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 800; }
.hero p { margin: 0; font-size: 1.1rem; max-width: 62ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card code { justify-self: start; }
.card p { margin: 0; font-size: .94rem; color: var(--ink-soft); }
.files { display: grid; gap: 6px; }
.file { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.file span.d { color: var(--ink-soft); font-size: .9rem; }
.file small { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 6px; max-width: 420px; }
.field input { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--sheet); color: var(--ink); }
.cert { border: 2px solid var(--board); border-radius: 16px; background: var(--sheet); padding: 24px; display: grid; gap: 10px; text-align: center; position: relative; overflow: hidden; }
.cert::before { content: ""; position: absolute; inset: 0 0 auto; height: 10px; background: repeating-linear-gradient(90deg, var(--accent) 0 24px, var(--chalk) 24px 48px, var(--board) 48px 72px); }
.cert h3 { font-size: 1.9rem; font-weight: 800; margin-top: 8px; }
.cert .who { font-family: var(--display); font-size: 1.6rem; color: var(--accent); }
.cert .meta { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: .92rem; }
.cert .code-v { font-family: var(--mono); font-weight: 600; letter-spacing: .08em; }
.locked { background: var(--sheet); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; color: var(--ink-soft); }
.retos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.reto { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.reto p { margin: 0; }
.reto button { justify-self: start; border: 0; background: none; color: var(--m); text-decoration: underline; cursor: pointer; padding: 0; font-size: .9rem; }
.reto .hint { color: var(--ink-soft); font-size: .92rem; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- glosario ---------- */
.term { border: 0; background: none; padding: 0; color: inherit; border-bottom: 2px dotted var(--accent); cursor: help; font: inherit; }
.pop { position: absolute; z-index: 20; max-width: 300px; background: var(--board); color: var(--board-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; box-shadow: 0 10px 30px #00000040; }
.pop b { color: var(--chalk); display: block; margin-bottom: 2px; }

.term-pv { margin: 0; padding: 14px 16px; background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: .8rem; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 140px; }
.blog { margin-top: 8px; font-family: var(--mono); font-size: .76rem; line-height: 1.6; background: var(--code-bg); color: #9fe07f; border-radius: 8px; padding: 8px 12px; overflow-x: auto; white-space: pre; }
.blog .dim { color: var(--code-dim); white-space: normal; }
.sec { border-left: 4px solid var(--bad); background: var(--bad-bg); border-radius: 0 10px 10px 0; padding: 12px 16px; max-width: 72ch; }
.sec b { color: var(--bad); }
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  .route { display: none; }
  .route-mobile { display: grid; gap: 4px; margin-bottom: 20px; }
  .route-mobile select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); }
  .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meter { flex-basis: 100%; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const DATA = {"pasos":[{"id":"paso-0","corto":"Crear la base de datos","letra":"","titulo":"Crear la base de datos de la cafetería","meta":"Tener una [[base de datos]] vacía llamada `cafeteria` donde vivirán los platos.","minutos":10,"entienda":["Hasta ahora los cinco platos estaban en un `List.of(...)` dentro de `MenuService`. Si quería agregar un plato tenía que cambiar el código, y nadie podía administrar el menú desde la página.","En clase conectó Rincones de Cartagena a PostgreSQL. Ahora hará lo mismo con la cafetería, **usted solo**. El usuario `adso` ya existe: solo falta crear una base de datos nueva para este proyecto."],"acciones":[{"t":"Verifique que PostgreSQL esté encendido:","code":{"archivo":"Terminal","lang":"sh","modo":"terminal","code":"sudo systemctl status postgresql   # debe decir active (salga con q)\nsudo systemctl start postgresql    # solo si dice inactive","notas":[]}},{"t":"Entre como administrador y cree la base de datos con dueño `adso`:","code":{"archivo":"Terminal","lang":"sh","modo":"terminal","code":"sudo -u postgres psql","notas":[]}},{"t":"Dentro de psql (el indicador dice `postgres=#`), escriba:","code":{"archivo":"psql · como postgres","lang":"sql","modo":"terminal","code":"CREATE DATABASE cafeteria OWNER adso;\n\\q","notas":[{"t":"Crea la base de datos `cafeteria`. `OWNER adso` hace que el usuario `adso` pueda crear tablas en ella.","line":0},{"t":"Sale de psql.","line":1}]}},{"t":"Compruebe que `adso` puede entrar (la contraseña es `adso2026`; no se ve mientras la escribe):","code":{"archivo":"Terminal","lang":"sh","modo":"terminal","code":"psql -h localhost -U adso -d cafeteria\n\\dt\n\\q","notas":[]}}],"ver":{"tipo":"terminal","url":"Terminal","texto":"$ psql -h localhost -U adso -d cafeteria\nPassword for user adso:\npsql (16.x)\ncafeteria=> \\dt\nDid not find any relations.\ncafeteria=> \\q","nota":"«Did not find any relations» significa que la base de datos existe y todavía no tiene tablas. Hibernate las creará en el paso 6."},"compruebe":["PostgreSQL está **active**.","Entró a psql como `adso` y el indicador dice `cafeteria=>`."],"pregunta":{"q":"¿Por qué la base de datos se crea con `OWNER adso`?","ops":["Para que sea más rápida","Para que el usuario adso pueda crear tablas en ella","Porque PostgreSQL no permite otro dueño","Para que no necesite contraseña"],"ok":1,"exp":"La aplicación entra con el usuario `adso`. Si la base de datos fuera de `postgres`, Hibernate no podría crear la tabla `plato` (*permission denied for schema public*)."},"errores":[{"s":"`role \"adso\" does not exist`","f":"No creó el usuario en clase. Dentro de psql como postgres: `CREATE USER adso WITH PASSWORD 'adso2026';` y luego cree la base de datos."},{"s":"`database \"cafeteria\" already exists`","f":"Ya la había creado. Puede seguir con el siguiente paso."},{"s":"`password authentication failed for user \"adso\"`","f":"La contraseña no coincide. Como postgres: `ALTER USER adso WITH PASSWORD 'adso2026';`"}]},{"id":"paso-1","corto":"Dependencias","letra":"","titulo":"Agregar JPA y el driver de PostgreSQL","meta":"Darle a la cafetería la capacidad de hablar con PostgreSQL.","minutos":10,"entienda":["**Spring Data JPA** trae [[JPA]], Hibernate y los repositorios. El [[driver]] de PostgreSQL es el traductor entre Java y ese servidor de base de datos.","Son las mismas dos dependencias que agregó a Rincones de Cartagena en clase."],"acciones":[{"t":"Antes de cambiar nada, guarde lo que tiene en Git. Si algo sale mal, podrá volver aquí:","code":{"archivo":"Terminal (en la carpeta cafeteria)","lang":"sh","modo":"terminal","code":"git add .\ngit commit -m \"cafeteria MVC terminada\"","notas":[]}},{"t":"Abra `pom.xml`, busque `\u003cdependencies>` y agregue estas dos **dentro**, junto a las que ya hay:","code":{"archivo":"pom.xml","lang":"html","modo":"fragmento","code":"        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-data-jpa\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.postgresql\u003c/groupId>\n            \u003cartifactId>postgresql\u003c/artifactId>\n            \u003cscope>runtime\u003c/scope>\n        \u003c/dependency>","notas":[{"t":"JPA + Hibernate + Spring Data JPA.","line":2},{"t":"El driver para conectarse a PostgreSQL.","line":6},{"t":"El driver solo se necesita al ejecutar la aplicación.","line":7}]}},{"t":"Guarde y acepte el aviso de VS Code para sincronizar el proyecto. **No ejecute todavía la aplicación**: sin el paso 2 no arranca."}],"compruebe":["Hizo el commit de respaldo.","`pom.xml` no tiene errores y terminó la sincronización (o `./mvnw compile` dice **BUILD SUCCESS**)."],"pregunta":{"q":"Si ejecuta la aplicación ahora mismo, sin hacer el paso 2, ¿qué pasa?","ops":["Funciona igual que antes","No arranca: Spring ve JPA y busca una base de datos que nadie le ha dicho dónde está","Crea la base de datos sola","Borra los platos"],"ok":1,"exp":"Spring Boot configura según lo que encuentra. Al ver JPA, intenta conectarse a una base de datos y falla con *Failed to configure a DataSource*."},"errores":[{"s":"VS Code no muestra el aviso de sincronización","f":"En la terminal ejecute `./mvnw compile`. La primera vez tarda porque descarga las dependencias."},{"s":"Error de XML en `pom.xml`","f":"Pegó las dependencias fuera de `\u003cdependencies>` o dentro de otra `\u003cdependency>`. Cada bloque `\u003cdependency>` va al mismo nivel que los existentes."}]},{"id":"paso-2","corto":"Conexión","letra":"","titulo":"Configurar la conexión","meta":"Decirle a Spring Boot dónde está la base de datos `cafeteria` y con qué usuario entrar.","minutos":5,"entienda":["Es la misma configuración de Rincones de Cartagena. Solo cambia el nombre de la base de datos al final de la URL."],"acciones":[{"t":"Reemplace todo `application.properties`:","code":{"archivo":"application.properties","ruta":"src/main/resources/","lang":"props","modo":"reemplazar","code":"spring.application.name=cafeteria\nspring.thymeleaf.cache=false\nserver.error.include-message=always\n\n# Conexión a PostgreSQL\nspring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria\nspring.datasource.username=adso\nspring.datasource.password=adso2026\n\n# JPA / Hibernate\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.open-in-view=false","notas":[{"t":"Servidor `localhost`, puerto `5432`, base de datos `cafeteria`.","line":5},{"t":"El usuario que creó en clase.","line":6},{"t":"Hibernate crea la tabla `plato` sola, a partir de la entidad del paso 3.","line":10},{"t":"Muestra en la consola cada SQL que se ejecuta. Lo usará para comprobar el CRUD.","line":11},{"t":"Apaga un aviso que aparece al arrancar.","line":12}],"nuevo":[4,5,6,7,9,10,11,12]}}],"compruebe":["La URL termina en `/cafeteria`, no en `/rincones`."],"pregunta":{"q":"¿Qué hace `spring.jpa.hibernate.ddl-auto=update`?","ops":["Borra la tabla en cada arranque","Crea o actualiza las tablas a partir de las entidades Java","Actualiza Spring Boot","Llena la tabla con datos de ejemplo"],"ok":1,"exp":"Con `update`, Hibernate compara las entidades con la base de datos y crea lo que falte. Así no escribe `CREATE TABLE` a mano. Los datos sí los cargará usted en el paso 6."},"errores":[{"s":"Spring sigue conectándose a `rincones`","f":"Está editando el `application.properties` de otro proyecto. Fíjese en el explorador de VS Code que sea el de `cafeteria`."}],"seguridad":"La contraseña escrita aquí sirve **solo para el laboratorio**. En un proyecto real se usa `${DB_PASSWORD}` y una variable de entorno, y nunca se sube una contraseña real a GitHub."},{"id":"paso-3","corto":"Plato: entidad","letra":"M","titulo":"Convertir Plato en una entidad","meta":"Que cada plato se guarde como una fila de la [[tabla]] `plato`.","minutos":15,"entienda":["Una [[entidad]] es una clase cuyos objetos se guardan en una tabla: cada objeto es una fila y cada atributo una columna.","JPA crea objetos vacíos y los llena dato por dato al leer la tabla. Por eso el record de antes ya no sirve: necesitamos una clase con **constructor vacío**, **getters** y **setters**."],"analogia":"El record era una ficha impresa: no se puede corregir. La entidad es una ficha con casillas que JPA puede llenar y corregir.","acciones":[{"t":"Reemplace todo `Plato.java`:","code":{"archivo":"Plato.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/model/","letra":"M","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.model;\n\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\n\n// MODELO: los datos de un plato, guardados en la tabla \"plato\"\n@Entity\npublic class Plato {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    private String nombre;\n    private String tipo;\n    private int precio;\n\n    public Plato() {\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getNombre() {\n        return nombre;\n    }\n\n    public void setNombre(String nombre) {\n        this.nombre = nombre;\n    }\n\n    public String getTipo() {\n        return tipo;\n    }\n\n    public void setTipo(String tipo) {\n        this.tipo = tipo;\n    }\n\n    public int getPrecio() {\n        return precio;\n    }\n\n    public void setPrecio(int precio) {\n        this.precio = precio;\n    }\n}","notas":[{"t":"Las anotaciones de JPA vienen del paquete `jakarta.persistence`.","line":2},{"t":"«Esta clase se guarda en una tabla». La tabla se llamará `plato`.","line":8},{"t":"`id` es la [[llave primaria]].","line":11},{"t":"PostgreSQL asigna el id: 1, 2, 3… Usted nunca lo escribe.","line":12},{"t":"Cada atributo será una columna: `nombre`, `tipo` y `precio`.","line":17},{"t":"El constructor vacío que JPA necesita.","line":19},{"t":"Thymeleaf usa `getNombre()` cuando escribe `${p.nombre}`: **las vistas no cambian**.","line":30}],"nuevo":[2,3,4,5,7,8,9,11,12,13,15,16,17,19,22,23,24,26,27,28,30,31,32,34,35,36,38,39,40,42,43,44,46,47,48,50,51,52,53]}},{"t":"Truco: para no escribir los getters y setters a mano, escriba los atributos, clic derecho en el editor → **Source Action…** → **Generate Getters and Setters** → seleccione todos."}],"compruebe":["`Plato.java` no tiene errores.","`MenuService.java` ahora sí tiene errores en rojo (`new Plato(1L, …)` y `p.tipo()` ya no existen). **Es normal**: lo arregla en el paso 5."],"pregunta":{"q":"Las vistas usan `${p.nombre}`. Con la entidad nueva, ¿hay que cambiar `menu.html`?","ops":["Sí, hay que escribir ${p.getNombre()}","No: Thymeleaf usa el getter getNombre() automáticamente","Sí, hay que borrar th:each","No, porque las vistas ya no se usan"],"ok":1,"exp":"Thymeleaf convierte `p.nombre` en una llamada a `getNombre()`. Por eso `menu.html` y `plato.html` siguen igual."},"errores":[{"s":"`jakarta` aparece en rojo","f":"La sincronización del paso 1 no terminó. Ejecute `./mvnw compile` y espere."},{"s":"Importé `javax.persistence` en lugar de `jakarta.persistence`","f":"En Spring Boot 3 y 4 el paquete es `jakarta`. Cambie los cuatro `import`."}]},{"id":"paso-4","corto":"PlatoRepository","letra":"M","titulo":"Crear el repositorio","meta":"Tener la pieza que lee y guarda platos en PostgreSQL, sin escribir SQL.","minutos":10,"entienda":["El [[repositorio]] es una **interfaz**: usted solo declara qué necesita y Spring Data escribe el código al arrancar. Ya trae `findAll`, `findById`, `save`, `deleteById`, `existsById` y `count`.","Los dos métodos que agregamos son [[consulta derivada|consultas derivadas]]: Spring lee el nombre y arma el SQL."],"acciones":[{"t":"Dentro de `cafeteria`, cree la carpeta `repository` (al lado de `model`, `service` y `controller`)."},{"t":"En esa carpeta: **New Java File** → **Interface**, nombre `PlatoRepository`:","code":{"archivo":"PlatoRepository.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/repository/","letra":"M","lang":"java","modo":"crear","code":"package co.edu.sena.adso.cafeteria.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\n\n// Spring Data escribe el código de esta interfaz al arrancar\npublic interface PlatoRepository extends JpaRepository\u003cPlato, Long> {\n\n    // SELECT * FROM plato ORDER BY nombre\n    List\u003cPlato> findAllByOrderByNombreAsc();\n\n    // SELECT * FROM plato WHERE lower(tipo) = lower(?) ORDER BY nombre\n    List\u003cPlato> findByTipoIgnoreCaseOrderByNombreAsc(String tipo);\n}","notas":[{"t":"Repositorio de la entidad `Plato`, cuya llave primaria es `Long`.","line":9},{"t":"**findAll** · **OrderBy Nombre Asc**: todos, ordenados por nombre de la A a la Z.","line":12},{"t":"**findBy Tipo IgnoreCase** · **OrderBy Nombre Asc**: los de un tipo, sin importar mayúsculas, ordenados por nombre.","line":15}]}}],"compruebe":["`PlatoRepository` está en la carpeta `repository` y no tiene errores."],"pregunta":{"q":"¿Qué consulta arma Spring con `findByTipoIgnoreCaseOrderByNombreAsc(\"BEBIDA\")`?","ops":["Todos los platos ordenados por tipo","Los platos de tipo bebida (sin importar mayúsculas), ordenados por nombre","Solo el primer plato de tipo BEBIDA","Ninguna: hay que escribir el SQL"],"ok":1,"exp":"`findBy` + `Tipo` (el atributo) + `IgnoreCase` + `OrderBy` + `Nombre` + `Asc`. Si escribe mal el nombre de un atributo, la aplicación no arranca y el error lo dice."},"errores":[{"s":"Al arrancar: `No property 'tipos' found for type 'Plato'`","f":"El nombre del método tiene un atributo que no existe. Debe ser `Tipo`, igual que el atributo `tipo` de la entidad."}]},{"id":"paso-5","corto":"MenuService","letra":"M","titulo":"El servicio ahora usa el repositorio","meta":"Cambiar la lista escrita a mano por consultas a PostgreSQL, **sin tocar los controladores**.","minutos":15,"entienda":["Este es el paso más importante de la ruta. `MenuController` y `MenuApiController` le piden los platos a `MenuService` con `todos()`, `porTipo()` y `buscar()`. Si el servicio conserva esos **mismos métodos**, a los controladores no les importa de dónde salen los datos.","Por eso solo cambia el interior del servicio: en lugar de la lista, le pide los platos al repositorio, que Spring le entrega por el constructor."],"analogia":"El mesero sigue pidiendo a la cocina igual que siempre. Lo que cambió es que la cocina ahora tiene una despensa de verdad (PostgreSQL) en lugar de cinco platos servidos sobre el mesón.","acciones":[{"t":"Reemplace todo `MenuService.java`. Fíjese en las líneas verdes: desaparece `List.of(...)` y entra el repositorio:","code":{"archivo":"MenuService.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/service/","letra":"M","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.service;\n\nimport java.util.List;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.server.ResponseStatusException;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.repository.PlatoRepository;\n\n@Service   // MODELO (lógica): las reglas del menú. Los datos están en PostgreSQL\npublic class MenuService {\n\n    private final PlatoRepository repo;\n\n    public MenuService(PlatoRepository repo) {   // Spring entrega el repositorio\n        this.repo = repo;\n    }\n\n    public List\u003cPlato> todos() {\n        return repo.findAllByOrderByNombreAsc();\n    }\n\n    public List\u003cPlato> porTipo(String tipo) {\n        return repo.findByTipoIgnoreCaseOrderByNombreAsc(tipo);\n    }\n\n    public Plato buscar(Long id) {\n        return repo.findById(id)\n                .orElseThrow(() -> new ResponseStatusException(\n                        HttpStatus.NOT_FOUND, \"No existe el plato \" + id));\n    }\n}","notas":[{"t":"Importa el repositorio del paso 4.","line":9},{"t":"El servicio necesita el repositorio. Ya no hay lista de platos.","line":14},{"t":"Inyección de dependencias: Spring le entrega el repositorio.","line":16},{"t":"`todos()` ahora consulta PostgreSQL.","line":21},{"t":"`porTipo()` usa la consulta derivada en lugar del `stream().filter(...)`.","line":25},{"t":"`buscar()` pide un plato por su id. Si no existe, sigue respondiendo 404 con el mismo mensaje.","line":29}],"nuevo":[9,11,14,16,17,21,25,29,33]}},{"t":"Abra `MenuController.java` y `MenuApiController.java`. **No los cambie**: solo confirme que siguen llamando a `menu.todos()`, `menu.porTipo(tipo)` y `menu.buscar(id)`."}],"compruebe":["Ningún archivo tiene errores en rojo.","No modificó `MenuController`, `MenuApiController`, `menu.html` ni `plato.html`."],"pregunta":{"q":"¿Por qué no hubo que cambiar `MenuController` ni `MenuApiController`?","ops":["Porque Spring los actualiza solo","Porque solo hablan con el servicio, y el servicio conservó los mismos métodos","Porque los controladores no usan datos","Sí hay que cambiarlos, pero después"],"ok":1,"exp":"Es la ventaja de tener el servicio en medio. En Rincones de Cartagena el controlador usaba el repositorio directamente; en una aplicación más grande, el servicio protege a los controladores de estos cambios."},"errores":[{"s":"`Parameter 0 of constructor in MenuService required a bean of type PlatoRepository`","f":"El repositorio está fuera del paquete principal o no extiende `JpaRepository`. Debe estar en `co.edu.sena.adso.cafeteria.repository`."}]},{"id":"paso-6","corto":"Arrancar y cargar platos","letra":"","titulo":"Arrancar y cargar los platos con SQL","meta":"Ver la tabla que creó Hibernate, cargarle los cinco platos y comprobar que el menú funciona igual que antes.","minutos":20,"entienda":["Al arrancar, Hibernate ve la entidad `Plato` y crea la tabla `plato`. Pero la tabla nace **vacía**: los cinco platos estaban en el código y ya no están.","Los cargará con `INSERT`, directamente en PostgreSQL. Así comprobará que la información vive en la base de datos y no en Java."],"acciones":[{"t":"Ejecute la aplicación y busque en la consola una línea que empieza por `Hibernate: create table plato`.","code":{"archivo":"Terminal 1","lang":"sh","modo":"terminal","code":"./mvnw spring-boot:run","notas":[]}},{"t":"Abra `localhost:8080/menu`. Aparece «Menú del día» **sin platos**: la tabla está vacía."},{"t":"Abra **otra** terminal (deje la aplicación corriendo), entre a psql y cargue los platos:","code":{"archivo":"Terminal 2","lang":"sh","modo":"terminal","code":"psql -h localhost -U adso -d cafeteria","notas":[]}},{"t":"Dentro de psql:","code":{"archivo":"psql · como adso","lang":"sql","modo":"terminal","code":"\\d plato\nINSERT INTO plato (nombre, tipo, precio) VALUES\n  ('Arepa de huevo', 'desayuno', 4000),\n  ('Arroz con pollo', 'almuerzo', 12000),\n  ('Mojarra frita con patacón', 'almuerzo', 18000),\n  ('Jugo de corozo', 'bebida', 3000),\n  ('Limonada de coco', 'bebida', 5000);\nSELECT * FROM plato;","notas":[{"t":"Describe la tabla que creó Hibernate: columnas `id`, `nombre`, `precio` y `tipo`.","line":0},{"t":"Agrega las cinco filas. No escribimos el `id`: PostgreSQL lo asigna.","line":1},{"t":"Muestra todas las filas, con su id del 1 al 5.","line":7}]}},{"t":"Recargue `/menu` y pruebe los botones de filtro, el detalle de un plato y `/api/menu`."}],"ver":{"url":"localhost:8080/menu","tipo":"menu","estilo":true,"detalle":true,"filtros":true,"interactivo":true,"extra":[{"url":"localhost:8080/api/menu","tipo":"json"},{"url":"Terminal 2 · psql","tipo":"terminal","texto":"cafeteria=> SELECT * FROM plato;\n precio | id |          nombre           |   tipo\n--------+----+---------------------------+----------\n   4000 |  1 | Arepa de huevo            | desayuno\n  12000 |  2 | Arroz con pollo           | almuerzo\n  18000 |  3 | Mojarra frita con patacón | almuerzo\n   3000 |  4 | Jugo de corozo            | bebida\n   5000 |  5 | Limonada de coco          | bebida\n(5 rows)"}],"nota":"Fíjese: ahora los platos salen **ordenados por nombre**, porque así lo pide la consulta derivada. El resto funciona igual que antes."},"compruebe":["Antes del `INSERT`, `/menu` salía sin platos.","Después del `INSERT`, `/menu` muestra los cinco platos ordenados por nombre.","Los filtros, `/menu/2` y `/api/menu` funcionan igual que antes.","Detuvo y volvió a ejecutar la aplicación, y los platos siguen ahí."],"pregunta":{"q":"En psql ejecuta `UPDATE plato SET precio = 4500 WHERE id = 1;` y recarga `/menu`. ¿Qué pasa?","ops":["Nada, hay que reiniciar la aplicación","La arepa de huevo aparece a $ 4.500, sin tocar el código","Sale un error 500","Se crea un plato nuevo"],"ok":1,"exp":"Cada visita a `/menu` consulta PostgreSQL. Pruébelo: verá en la consola la línea `Hibernate: select …` en cada recarga."},"errores":[{"s":"`Connection to localhost:5432 refused`","f":"PostgreSQL está apagado: `sudo systemctl start postgresql`."},{"s":"`permission denied for schema public`","f":"La base de datos no es de `adso`. Como postgres: `ALTER DATABASE cafeteria OWNER TO adso;`"},{"s":"En psql: `relation \"plato\" does not exist`","f":"La aplicación todavía no ha arrancado bien (Hibernate no creó la tabla) o entró a otra base de datos. Revise que diga `cafeteria=>`."},{"s":"`/menu` da error *Property or field 'nombre' cannot be found*","f":"Faltan los getters en `Plato`."}]},{"id":"paso-7","corto":"Admin: la tabla","letra":"C","titulo":"R · La página de administración","meta":"Crear `/admin/platos`, una tabla con todos los platos para el personal de la cafetería.","minutos":20,"entienda":["El menú (`/menu`) es para los **clientes**: solo mira. El [[CRUD]] (crear, editar, eliminar) es para el **personal**, así que vive en otra zona: `/admin/platos`, con su propio controlador.","`@RequestMapping(\"/admin/platos\")` sobre la clase pone ese prefijo a todos sus métodos, como en `MenuApiController`.","El controlador nuevo usa **el mismo** `MenuService`. Ya hay tres controladores compartiendo un solo servicio."],"acciones":[{"t":"En la carpeta `controller` cree `AdminController.java`:","code":{"archivo":"AdminController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"crear","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller\n@RequestMapping(\"/admin/platos\")   // Todas las rutas de la clase empiezan así\npublic class AdminController {\n\n    private final MenuService menu;   // El mismo servicio de siempre\n\n    public AdminController(MenuService menu) {\n        this.menu = menu;\n    }\n\n    // READ · GET /admin/platos  → tabla con todos los platos\n    @GetMapping\n    public String lista(Model model) {\n        model.addAttribute(\"platos\", menu.todos());\n        return \"admin\";\n    }\n}","notas":[{"t":"Prefijo de todas las rutas de esta clase.","line":10},{"t":"El mismo servicio que usan `MenuController` y `MenuApiController`.","line":13},{"t":"Pone todos los platos en la bandeja con el nombre `platos`.","line":22},{"t":"La vista: `templates/admin.html`.","line":23}]}},{"t":"En `templates` cree `admin.html`:","code":{"archivo":"admin.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"crear","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Administrar platos\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>Administrar platos\u003c/h1>\n\n  \u003cdiv class=\"barra\">\n    \u003ca th:href=\"@{/menu}\">Ver el menú público\u003c/a>\n  \u003c/div>\n\n  \u003ctable>\n    \u003cthead>\n      \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Precio\u003c/th>\u003c/tr>\n    \u003c/thead>\n    \u003ctbody>\n      \u003ctr th:each=\"p : ${platos}\">\n        \u003ctd th:text=\"${p.nombre}\">Plato\u003c/td>\n        \u003ctd th:text=\"${p.tipo}\">tipo\u003c/td>\n        \u003ctd>$ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\u003c/td>\n      \u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cdiv class=\"vacio\" th:if=\"${#lists.isEmpty(platos)}\">Todavía no hay platos.\u003c/div>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Una barra de enlaces. En el paso 8 le agregará el botón «Nuevo plato».","line":10},{"t":"Una tabla HTML: más cómoda que tarjetas para administrar muchos registros.","line":14},{"t":"Repite una **fila** (`\u003ctr>`) por cada plato.","line":19},{"t":"Cada `\u003ctd>` es una celda: nombre, tipo y precio.","line":21},{"t":"Mensaje cuando no hay platos.","line":26}]}},{"t":"Agregue al **final** de `static/css/cafeteria.css` los estilos de la administración (tabla, botones y formulario; el formulario lo usará en el paso 8):","code":{"archivo":"cafeteria.css (agregue al final)","ruta":"src/main/resources/static/css/","lang":"css","modo":"fragmento","code":"/* ===== NUEVO: administración (tabla, botones y formulario) ===== */\n.barra {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 16px;\n}\n\n.boton {\n  display: inline-block;\n  background: var(--mar);\n  color: white;\n  border: 0;\n  border-radius: 8px;\n  padding: 6px 14px;\n  font: inherit;\n  font-weight: bold;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.boton.secundario {\n  background: #e6e6e6;\n  color: var(--texto);\n}\n\n.boton.peligro {\n  background: var(--corozo);\n}\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  background: white;\n  border-radius: 8px;\n  overflow: hidden;\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);\n}\n\nth, td {\n  text-align: left;\n  padding: 10px 12px;\n  border-bottom: 1px solid #eee;\n}\n\nth {\n  background: var(--mar);\n  color: white;\n}\n\n.acciones {\n  display: flex;\n  gap: 8px;\n}\n\n.vacio {\n  margin-top: 16px;\n  text-align: center;\n}\n\n.formulario {\n  background: white;\n  padding: 20px;\n  border-radius: 8px;\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);\n}\n\n.formulario label {\n  display: block;\n  font-weight: bold;\n  margin: 12px 0 4px;\n}\n\n.formulario input,\n.formulario select {\n  width: 100%;\n  box-sizing: border-box;\n  padding: 8px;\n  border: 1px solid #ccc;\n  border-radius: 6px;\n  font: inherit;\n}\n\n.formulario .acciones {\n  margin-top: 16px;\n}","notas":[{"t":"Estilo de botón para enlaces y botones. `.secundario` y `.peligro` cambian el color.","line":8},{"t":"La tabla: fondo blanco, sin espacio entre celdas y con sombra.","line":30},{"t":"Los encabezados de la tabla, en azul mar.","line":45},{"t":"Estilos del formulario del paso 8.","line":60}]}},{"t":"Guarde y abra `localhost:8080/admin/platos`."}],"ver":{"url":"localhost:8080/admin/platos","tipo":"admin","nivel":1},"compruebe":["`/admin/platos` muestra la tabla con los cinco platos.","El enlace «Ver el menú público» lleva a `/menu`.","En la consola aparece `Hibernate: select …` al cargar la página."],"pregunta":{"q":"¿Qué ruta atiende el método `lista()`, que solo tiene `@GetMapping` sin texto?","ops":["GET /","GET /lista","GET /admin/platos","Ninguna, falta la ruta"],"ok":2,"exp":"Sin texto, el método toma exactamente el prefijo de la clase: `/admin/platos`."},"errores":[{"s":"`Error resolving template [admin]`","f":"El archivo debe ser `src/main/resources/templates/admin.html`."},{"s":"La tabla sale sin estilos","f":"Pegó el CSS en otro archivo o fuera de `cafeteria.css`. Abra `localhost:8080/css/cafeteria.css` y busque `.boton` al final."}]},{"id":"paso-8","corto":"C · Crear","letra":"C","titulo":"C · Crear platos con un formulario","meta":"Agregar «Nuevo plato»: un formulario que guarda en PostgreSQL.","minutos":25,"entienda":["Crear necesita **dos** endpoints: `GET /admin/platos/nuevo` muestra el formulario vacío y `POST /admin/platos` recibe lo que el usuario escribió.","`@ModelAttribute` crea un `Plato` y lo llena con los campos del formulario. El servicio lo guarda con `repo.save(...)`.","Después de guardar, el controlador responde `redirect:/admin/platos`: el navegador vuelve a la tabla. Es el patrón [[PRG]], el mismo de Rincones.","Novedad: el servicio aplica una **regla de negocio** antes de guardar. Esto es lo que justifica tener un servicio: el controlador no decide reglas."],"acciones":[{"t":"Agregue a `MenuService` el método `guardar`:","code":{"archivo":"MenuService.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/service/","letra":"M","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.service;\n\nimport java.util.List;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.server.ResponseStatusException;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.repository.PlatoRepository;\n\n@Service   // MODELO (lógica): las reglas del menú. Los datos están en PostgreSQL\npublic class MenuService {\n\n    private final PlatoRepository repo;\n\n    public MenuService(PlatoRepository repo) {   // Spring entrega el repositorio\n        this.repo = repo;\n    }\n\n    public List\u003cPlato> todos() {\n        return repo.findAllByOrderByNombreAsc();\n    }\n\n    public List\u003cPlato> porTipo(String tipo) {\n        return repo.findByTipoIgnoreCaseOrderByNombreAsc(tipo);\n    }\n\n    public Plato buscar(Long id) {\n        return repo.findById(id)\n                .orElseThrow(() -> new ResponseStatusException(\n                        HttpStatus.NOT_FOUND, \"No existe el plato \" + id));\n    }\n\n    // Regla: el tipo siempre se guarda en minúsculas\n    public Plato guardar(Plato plato) {\n        plato.setTipo(plato.getTipo().toLowerCase());\n        return repo.save(plato);          // sin id: INSERT · con id: UPDATE\n    }\n}","notas":[{"t":"La regla: si alguien guarda «BEBIDA», queda «bebida». Así el filtro siempre funciona.","line":36},{"t":"Sin id hace `INSERT`; con id hace `UPDATE` (lo usará en el paso 9).","line":37}],"nuevo":[34,35,36,37,39]}},{"t":"Reemplace `AdminController.java` (métodos `nuevo` y `guardar`):","code":{"archivo":"AdminController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller\n@RequestMapping(\"/admin/platos\")   // Todas las rutas de la clase empiezan así\npublic class AdminController {\n\n    private final MenuService menu;   // El mismo servicio de siempre\n\n    public AdminController(MenuService menu) {\n        this.menu = menu;\n    }\n\n    // READ · GET /admin/platos  → tabla con todos los platos\n    @GetMapping\n    public String lista(Model model) {\n        model.addAttribute(\"platos\", menu.todos());\n        return \"admin\";\n    }\n\n    // CREATE (1) · GET /admin/platos/nuevo  → formulario vacío\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"plato\", new Plato());\n        model.addAttribute(\"accion\", \"Nuevo plato\");\n        return \"plato-form\";\n    }\n\n    // CREATE (2) y UPDATE (2) · POST /admin/platos  → guardar\n    @PostMapping\n    public String guardar(@ModelAttribute(\"plato\") Plato plato) {\n        menu.guardar(plato);\n        return \"redirect:/admin/platos\";\n    }\n}","notas":[{"t":"Un plato vacío para que el formulario tenga dónde escribir.","line":32},{"t":"Título del formulario. El mismo formulario servirá para editar.","line":33},{"t":"Spring llena un `Plato` con los campos `nombre`, `tipo` y `precio` del formulario.","line":39},{"t":"Vuelve a la tabla. Si el usuario recarga, no se guarda dos veces.","line":41}],"nuevo":[5,6,9,29,30,31,32,33,34,37,38,39,40,41,42,43]}},{"t":"Cree `templates/plato-form.html`:","code":{"archivo":"plato-form.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"crear","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${accion}\">Plato\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${accion}\">Nuevo plato\u003c/h1>\n\n  \u003cform class=\"formulario\" th:action=\"@{/admin/platos}\" th:object=\"${plato}\" method=\"post\">\n    \u003cinput type=\"hidden\" th:field=\"*{id}\">\n\n    \u003clabel for=\"nombre\">Nombre\u003c/label>\n    \u003cinput type=\"text\" th:field=\"*{nombre}\" required>\n\n    \u003clabel for=\"tipo\">Tipo\u003c/label>\n    \u003cselect th:field=\"*{tipo}\" required>\n      \u003coption value=\"\">Elija un tipo\u003c/option>\n      \u003coption value=\"desayuno\">Desayuno\u003c/option>\n      \u003coption value=\"almuerzo\">Almuerzo\u003c/option>\n      \u003coption value=\"bebida\">Bebida\u003c/option>\n    \u003c/select>\n\n    \u003clabel for=\"precio\">Precio (pesos)\u003c/label>\n    \u003cinput type=\"number\" th:field=\"*{precio}\" min=\"0\" step=\"100\" required>\n\n    \u003cdiv class=\"acciones\">\n      \u003cbutton type=\"submit\" class=\"boton\">Guardar\u003c/button>\n      \u003ca th:href=\"@{/admin/platos}\" class=\"boton secundario\">Cancelar\u003c/a>\n    \u003c/div>\n  \u003c/form>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Al guardar, se envía a **POST /admin/platos**.","line":10},{"t":"Campo oculto con el id. Vacío al crear; lo necesitará para editar en el paso 9.","line":11},{"t":"Conecta la caja con el atributo `nombre` del plato.","line":14},{"t":"Una lista desplegable: el usuario no puede inventar tipos. `th:field` marca la opción del plato al editar.","line":17},{"t":"Solo números, desde 0, de 100 en 100 pesos.","line":25},{"t":"Cancelar vuelve a la tabla sin guardar.","line":29}]}},{"t":"Reemplace `admin.html` (se agregó el botón «Nuevo plato»):","code":{"archivo":"admin.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Administrar platos\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>Administrar platos\u003c/h1>\n\n  \u003cdiv class=\"barra\">\n    \u003ca th:href=\"@{/admin/platos/nuevo}\" class=\"boton\">+ Nuevo plato\u003c/a>\n    \u003ca th:href=\"@{/menu}\">Ver el menú público\u003c/a>\n  \u003c/div>\n\n  \u003ctable>\n    \u003cthead>\n      \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Precio\u003c/th>\u003c/tr>\n    \u003c/thead>\n    \u003ctbody>\n      \u003ctr th:each=\"p : ${platos}\">\n        \u003ctd th:text=\"${p.nombre}\">Plato\u003c/td>\n        \u003ctd th:text=\"${p.tipo}\">tipo\u003c/td>\n        \u003ctd>$ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\u003c/td>\n      \u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cdiv class=\"vacio\" th:if=\"${#lists.isEmpty(platos)}\">Todavía no hay platos.\u003c/div>\n\u003c/body>\n\u003c/html>","notas":[],"nuevo":[11]}},{"t":"Cree la carimañola: nombre «Carimañola», tipo **Desayuno**, precio `2500`."}],"ver":{"url":"localhost:8080/admin/platos","tipo":"admin","nivel":2,"interactivo":true,"nota":"Esta vista previa funciona: presione «Nuevo plato» y guarde uno."},"compruebe":["«+ Nuevo plato» abre el formulario y Cancelar vuelve a la tabla.","Al guardar la carimañola, vuelve a la tabla y aparece.","En la consola aparece `Hibernate: insert into plato …`.","La carimañola aparece también en `/menu`, en `/menu?tipo=desayuno` y en `/api/menu`.","En psql, `SELECT * FROM plato;` la muestra con el id 6."],"pregunta":{"q":"Guardó un plato y, ya en la tabla, presiona F5 (recargar). ¿Qué pasa?","ops":["Se guarda otra vez el mismo plato","Solo se recarga la tabla, porque después de guardar hubo una redirección a GET","Sale un error 405","Se borra el plato"],"ok":1,"exp":"Gracias a `redirect:`, la última petición del navegador es un `GET /admin/platos`. Recargar repite ese GET, no el POST."},"errores":[{"s":"Al guardar: *Field error … precio … Failed to convert*","f":"Envió el precio vacío o con puntos. Escríbalo sin puntos: `2500`. El atributo `required` del campo lo evita."},{"s":"Al guardar: `NullPointerException` en `toLowerCase`","f":"El formulario no envió el tipo. Revise que el `\u003cselect>` tenga `th:field=\"*{tipo}\"`."},{"s":"`Error resolving template [plato-form]`","f":"El archivo debe llamarse exactamente `plato-form.html` y estar en `templates`."}],"seguridad":"Mire la línea `insert` de la consola: los datos aparecen como `?`. Hibernate los envía aparte de la consulta. Si alguien escribe código SQL en el nombre del plato, se guarda como texto y no se ejecuta: así se evita la [[inyección SQL]]."},{"id":"paso-9","corto":"U · Editar","letra":"C","titulo":"U · Editar un plato","meta":"Un botón «Editar» en cada fila que abre el formulario con los datos del plato.","minutos":15,"entienda":["Editar reutiliza el **mismo formulario** y el **mismo** `POST /admin/platos`. Solo falta el endpoint que busca el plato y llena el formulario: `GET /admin/platos/{id}/editar`.","La clave es el campo oculto `id`: al editar, el formulario lo envía, y `save` hace `UPDATE` en lugar de `INSERT`."],"acciones":[{"t":"Reemplace `AdminController.java` (método `editar`):","code":{"archivo":"AdminController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller\n@RequestMapping(\"/admin/platos\")   // Todas las rutas de la clase empiezan así\npublic class AdminController {\n\n    private final MenuService menu;   // El mismo servicio de siempre\n\n    public AdminController(MenuService menu) {\n        this.menu = menu;\n    }\n\n    // READ · GET /admin/platos  → tabla con todos los platos\n    @GetMapping\n    public String lista(Model model) {\n        model.addAttribute(\"platos\", menu.todos());\n        return \"admin\";\n    }\n\n    // CREATE (1) · GET /admin/platos/nuevo  → formulario vacío\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"plato\", new Plato());\n        model.addAttribute(\"accion\", \"Nuevo plato\");\n        return \"plato-form\";\n    }\n\n    // CREATE (2) y UPDATE (2) · POST /admin/platos  → guardar\n    @PostMapping\n    public String guardar(@ModelAttribute(\"plato\") Plato plato) {\n        menu.guardar(plato);\n        return \"redirect:/admin/platos\";\n    }\n\n    // UPDATE (1) · GET /admin/platos/3/editar  → formulario con los datos\n    @GetMapping(\"/{id}/editar\")\n    public String editar(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"plato\", menu.buscar(id));\n        model.addAttribute(\"accion\", \"Editar plato\");\n        return \"plato-form\";\n    }\n}","notas":[{"t":"Atiende, por ejemplo, `/admin/platos/3/editar`.","line":46},{"t":"El mismo `buscar` del detalle: si el plato no existe, responde 404.","line":48},{"t":"El título cambia; la vista es la misma `plato-form`.","line":49}],"nuevo":[6,45,46,47,48,49,50,52]}},{"t":"Reemplace `admin.html` (columna «Acciones» con el botón Editar):","code":{"archivo":"admin.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Administrar platos\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>Administrar platos\u003c/h1>\n\n  \u003cdiv class=\"barra\">\n    \u003ca th:href=\"@{/admin/platos/nuevo}\" class=\"boton\">+ Nuevo plato\u003c/a>\n    \u003ca th:href=\"@{/menu}\">Ver el menú público\u003c/a>\n  \u003c/div>\n\n  \u003ctable>\n    \u003cthead>\n      \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Precio\u003c/th>\u003cth>Acciones\u003c/th>\u003c/tr>\n    \u003c/thead>\n    \u003ctbody>\n      \u003ctr th:each=\"p : ${platos}\">\n        \u003ctd th:text=\"${p.nombre}\">Plato\u003c/td>\n        \u003ctd th:text=\"${p.tipo}\">tipo\u003c/td>\n        \u003ctd>$ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\u003c/td>\n        \u003ctd class=\"acciones\">\n          \u003ca th:href=\"@{/admin/platos/{id}/editar(id=${p.id})}\" class=\"boton secundario\">Editar\u003c/a>\n        \u003c/td>\n      \u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cdiv class=\"vacio\" th:if=\"${#lists.isEmpty(platos)}\">Todavía no hay platos.\u003c/div>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Construye el enlace de cada fila: `/admin/platos/3/editar`.","line":25}],"nuevo":[17,24,25,26]}},{"t":"Suba el precio de la mojarra a `19000` y guarde."}],"ver":{"url":"localhost:8080/admin/platos","tipo":"admin","nivel":3,"interactivo":true,"nota":"Pruebe «Editar» en la vista previa: el formulario se abre con los datos del plato."},"compruebe":["Cada fila tiene **Editar** y el formulario se abre con sus datos, incluido el tipo en la lista desplegable.","Al guardar, cambia el plato **y no aparece uno nuevo**.","En la consola aparece `Hibernate: update plato …`.","`/admin/platos/99/editar` responde 404."],"pregunta":{"q":"Al editar la mojarra, ¿cómo sabe `save` que debe hacer `UPDATE` y no `INSERT`?","ops":["Porque el botón dice Editar","Porque el plato llega con id (el campo oculto del formulario)","Porque el precio cambió","Porque la URL tiene /editar"],"ok":1,"exp":"El formulario siempre se envía a `POST /admin/platos`. La única diferencia es el `id` oculto: vacío → `INSERT`, con valor → `UPDATE`."},"errores":[{"s":"Al editar se crea un plato nuevo","f":"Falta `\u003cinput type=\"hidden\" th:field=\"*{id}\">` en `plato-form.html`."},{"s":"El tipo no aparece seleccionado al editar","f":"El `\u003cselect>` necesita `th:field=\"*{tipo}\"` y los `value` de las opciones en minúsculas."}]},{"id":"paso-10","corto":"D · Eliminar","letra":"C","titulo":"D · Eliminar un plato","meta":"Un botón «Eliminar» en cada fila, con confirmación.","minutos":15,"entienda":["Eliminar cambia datos, así que se hace con un **formulario POST**, no con un enlace. Los navegadores y buscadores abren enlaces solos; si eliminar fuera un enlace GET, podrían borrar datos sin que nadie hiciera clic.","El servicio tiene otra regla: si el plato no existe, responde 404 en lugar de no hacer nada."],"acciones":[{"t":"Agregue a `MenuService` el método `eliminar`:","code":{"archivo":"MenuService.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/service/","letra":"M","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.service;\n\nimport java.util.List;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.server.ResponseStatusException;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.repository.PlatoRepository;\n\n@Service   // MODELO (lógica): las reglas del menú. Los datos están en PostgreSQL\npublic class MenuService {\n\n    private final PlatoRepository repo;\n\n    public MenuService(PlatoRepository repo) {   // Spring entrega el repositorio\n        this.repo = repo;\n    }\n\n    public List\u003cPlato> todos() {\n        return repo.findAllByOrderByNombreAsc();\n    }\n\n    public List\u003cPlato> porTipo(String tipo) {\n        return repo.findByTipoIgnoreCaseOrderByNombreAsc(tipo);\n    }\n\n    public Plato buscar(Long id) {\n        return repo.findById(id)\n                .orElseThrow(() -> new ResponseStatusException(\n                        HttpStatus.NOT_FOUND, \"No existe el plato \" + id));\n    }\n\n    // Regla: el tipo siempre se guarda en minúsculas\n    public Plato guardar(Plato plato) {\n        plato.setTipo(plato.getTipo().toLowerCase());\n        return repo.save(plato);          // sin id: INSERT · con id: UPDATE\n    }\n\n    // Regla: no se puede eliminar un plato que no existe\n    public void eliminar(Long id) {\n        if (!repo.existsById(id)) {\n            throw new ResponseStatusException(HttpStatus.NOT_FOUND, \"No existe el plato \" + id);\n        }\n        repo.deleteById(id);\n    }\n}","notas":[{"t":"Pregunta a PostgreSQL si existe un plato con ese id.","line":42},{"t":"Borra la fila: `DELETE`.","line":45}],"nuevo":[40,41,42,43,45,46,47]}},{"t":"Reemplace `AdminController.java` con su versión final (método `eliminar`):","code":{"archivo":"AdminController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller\n@RequestMapping(\"/admin/platos\")   // Todas las rutas de la clase empiezan así\npublic class AdminController {\n\n    private final MenuService menu;   // El mismo servicio de siempre\n\n    public AdminController(MenuService menu) {\n        this.menu = menu;\n    }\n\n    // READ · GET /admin/platos  → tabla con todos los platos\n    @GetMapping\n    public String lista(Model model) {\n        model.addAttribute(\"platos\", menu.todos());\n        return \"admin\";\n    }\n\n    // CREATE (1) · GET /admin/platos/nuevo  → formulario vacío\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"plato\", new Plato());\n        model.addAttribute(\"accion\", \"Nuevo plato\");\n        return \"plato-form\";\n    }\n\n    // CREATE (2) y UPDATE (2) · POST /admin/platos  → guardar\n    @PostMapping\n    public String guardar(@ModelAttribute(\"plato\") Plato plato) {\n        menu.guardar(plato);\n        return \"redirect:/admin/platos\";\n    }\n\n    // UPDATE (1) · GET /admin/platos/3/editar  → formulario con los datos\n    @GetMapping(\"/{id}/editar\")\n    public String editar(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"plato\", menu.buscar(id));\n        model.addAttribute(\"accion\", \"Editar plato\");\n        return \"plato-form\";\n    }\n\n    // DELETE · POST /admin/platos/3/eliminar\n    @PostMapping(\"/{id}/eliminar\")\n    public String eliminar(@PathVariable(\"id\") Long id) {\n        menu.eliminar(id);\n        return \"redirect:/admin/platos\";\n    }\n}","notas":[{"t":"Atiende el formulario del botón Eliminar: `POST /admin/platos/3/eliminar`.","line":54}],"nuevo":[53,54,55,56,57,59]}},{"t":"Reemplace `admin.html` con su versión final (formulario del botón Eliminar):","code":{"archivo":"admin.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Administrar platos\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>Administrar platos\u003c/h1>\n\n  \u003cdiv class=\"barra\">\n    \u003ca th:href=\"@{/admin/platos/nuevo}\" class=\"boton\">+ Nuevo plato\u003c/a>\n    \u003ca th:href=\"@{/menu}\">Ver el menú público\u003c/a>\n  \u003c/div>\n\n  \u003ctable>\n    \u003cthead>\n      \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Precio\u003c/th>\u003cth>Acciones\u003c/th>\u003c/tr>\n    \u003c/thead>\n    \u003ctbody>\n      \u003ctr th:each=\"p : ${platos}\">\n        \u003ctd th:text=\"${p.nombre}\">Plato\u003c/td>\n        \u003ctd th:text=\"${p.tipo}\">tipo\u003c/td>\n        \u003ctd>$ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\u003c/td>\n        \u003ctd class=\"acciones\">\n          \u003ca th:href=\"@{/admin/platos/{id}/editar(id=${p.id})}\" class=\"boton secundario\">Editar\u003c/a>\n          \u003cform th:action=\"@{/admin/platos/{id}/eliminar(id=${p.id})}\" method=\"post\"\n                onsubmit=\"return confirm('¿Eliminar este plato?')\">\n            \u003cbutton type=\"submit\" class=\"boton peligro\">Eliminar\u003c/button>\n          \u003c/form>\n        \u003c/td>\n      \u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cdiv class=\"vacio\" th:if=\"${#lists.isEmpty(platos)}\">Todavía no hay platos.\u003c/div>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Un pequeño formulario por fila que envía POST.","line":26},{"t":"Pide confirmación. Si el usuario cancela, no se envía.","line":27}],"nuevo":[26,27,28,29]}},{"t":"Elimine la carimañola que creó en el paso 8."}],"ver":{"url":"localhost:8080/admin/platos","tipo":"admin","nivel":4,"interactivo":true,"nota":"La vista previa tiene el CRUD completo. En su máquina, el navegador pedirá confirmación antes de eliminar."},"compruebe":["Al eliminar y confirmar, la fila desaparece y en la consola aparece `Hibernate: delete from plato …`.","Si cancela la confirmación, no se borra nada.","El plato eliminado ya no está en `/menu` ni en `/api/menu`."],"pregunta":{"q":"¿Por qué el botón Eliminar es un formulario POST y no un enlace `\u003ca href>`?","ops":["Porque se ve más bonito","Porque los enlaces hacen GET, y GET nunca debe cambiar datos","Porque Thymeleaf no permite enlaces en tablas","Porque POST es más rápido"],"ok":1,"exp":"GET es para pedir información. Lo que crea, cambia o borra datos va con POST (o PUT y DELETE en una API)."},"errores":[{"s":"Al eliminar: `405 Method Not Allowed`","f":"El `\u003cform>` no tiene `method=\"post\"`."},{"s":"El botón Eliminar aparece debajo de Editar","f":"Falta el CSS `.acciones { display: flex; }` o la clase `acciones` en la celda."}]},{"id":"paso-11","corto":"El recorrido","letra":"","titulo":"Siga el recorrido de «Guardar»","meta":"Ver todas las piezas que se mueven cuando alguien guarda un plato, desde el formulario hasta PostgreSQL.","minutos":15,"entienda":["Use el simulador: cada clic avanza una etapa del `POST /admin/platos` que se envía al guardar la carimañola. Después compruebe cada operación en su máquina."],"recorrido":{"nodos":[["","Navegador","formulario"],["C","Controlador","AdminController"],["M","Servicio","MenuServi // mini-markdown: **negrita**, `código`, *cursiva*, [[término|texto]]
function md(t, plain) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, k, l) => plain ? `<b>${l || k}</b>` : `<button type="button" class="term" data-t="${k}">${l || k}</button>`);
  return h;
}

const RX = {
  java: [/(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@\w+)|\b(package|import|public|private|final|class|record|return|new|static|void|null|int|this|if|else)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d+L?)\b/g, ['com', 'str', 'ann', 'kw', 'typ', 'num']],
  html: [/(<!--.*?-->)|(<\/?[a-zA-Z][\w-]*|\/?>)|(th:[\w-]+|xmlns:th)(?==)|([a-zA-Z-]+)(?==)|("[^"]*")/g, ['com', 'tag', 'th', 'attr', 'str']],
  css: [/(\/\*.*?\*\/)|(--[\w-]+)|^(\s+[a-z-]+)(?=\s*:)|(#[0-9a-fA-F]{3,6}\b)/g, ['com', 'var', 'prop', 'num']],
  props: [/^([\w.-]+)(?==)|(=.*$)/g, ['attr', 'str']],
  sh: [/(#.*$)|^(\.\/mvnw|[a-z]+)(?=\s|$)/g, ['com', 'cmd']],
  sql: [/(--.*$)|('(?:[^']|'')*')|\b(CREATE|DATABASE|OWNER|USER|WITH|PASSWORD|INSERT|INTO|VALUES|SELECT|FROM|WHERE|UPDATE|SET|DELETE|ORDER|BY|ALTER|TO)\b|(\\[a-z]+)|\b(\d+)\b/g, ['com', 'str', 'kw', 'cmd', 'num']],
  tree: [/(←.*$)|(\s[MVC]\s\s)/g, ['com', 'ann']],
};
function hl(line, lang) {
  if (lang === 'css' && /^[^\s].*\{\s*$/.test(line)) return '<span class="t-sel">' + esc(line.replace(/\{\s*$/, '')) + '</span>{';
  const r = RX[lang]; if (!r) return esc(line);
  const [rx, cls] = r; rx.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = rx.exec(line))) {
    if (m[0] === '') { rx.lastIndex++; continue; }
    const gi = m.slice(1).findIndex(x => x !== undefined);
    out += esc(line.slice(last, m.index)) + `<span class="t-${cls[gi]}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}
